<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <meta name="description" content="Концертный сет-лист Халдеев: порядок песен, два отделения и хронометраж.">
  <title>Халдеи — сет-лист</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="heading"><h1>ХАЛДЕИ <span>Сет-лист</span></h1><span class="save-state" id="save-state" role="status">Загрузка…</span></div>
      <div class="totals" aria-label="Хронометраж музыки">
        <div><span>I отделение</span><strong id="time-1">—</strong><small id="count-1">—</small></div>
        <div><span>II отделение</span><strong id="time-2">—</strong><small id="count-2">—</small></div>
        <div class="total"><span>Вся музыка</span><strong id="time-all">—</strong><small>без перерыва</small></div>
      </div>
      <div class="toolbar">
        <button id="export" type="button">Скачать JSON <span aria-hidden="true">↓</span></button>
        <button id="import" type="button">Загрузить JSON <span aria-hidden="true">↑</span></button>
        <input id="file" type="file" accept=".json,application/json" hidden>
      </div>
      <p id="notice" class="notice" role="status" hidden></p>
    </header>
    <p class="hint" id="instructions">Тяни за <span aria-hidden="true">⠿</span>, чтобы менять порядок. Перерыв тоже можно двигать.</p>
    <div class="section-label"><span>I отделение</span><span class="column-hint">мин:сек · BPM</span></div>
    <ol id="setlist" aria-label="Песни и перерыв" aria-describedby="instructions"></ol>
    <p class="footnote">Порядок сохраняется в этом браузере. Для другого устройства используй JSON.</p>
    <noscript><p class="notice">Включи JavaScript, чтобы редактировать сет-лист.</p></noscript>
    <p id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  </main>
</body>
</html>
